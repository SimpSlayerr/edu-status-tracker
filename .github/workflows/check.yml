name: Minobrnauki Status Tracker

on:
  schedule:
    # Dead-simple 2-hour interval (GitHub parser never chokes on this)
    - cron: '27 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & dependencies
        run: |
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Run status checker
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REG_NUMBER: ${{ secrets.REG_NUMBER }}
          APP_EMAIL: ${{ secrets.APP_EMAIL }}
        run: python tracker.py

      - name: Commit updated status
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_status.txt || true
          git diff --staged --quiet || (git commit -m "chore: update status cache [skip ci]" && git push)
