name: Minobrnauki Status Tracker

on:
  schedule:
    - cron: '27 8 * * 1-5'   # 1:27 PM PKT (08:27 UTC)
    - cron: '27 10 * * 1-5'  # 3:27 PM PKT (10:27 UTC)
    - cron: '27 12 * * 1-5'  # 5:27 PM PKT (12:27 UTC)
    - cron: '27 14 * * 1-5'  # 7:27 PM PKT (14:27 UTC)
    - cron: '27 16 * * 1-5'  # 9:27 PM PKT (16:27 UTC)
    - cron: '27 18 * * 1-5'  # 11:27 PM PKT (18:27 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & dependencies
        run: |
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Run status checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REG_NUMBER: ${{ secrets.REG_NUMBER }}
          APP_EMAIL: ${{ secrets.APP_EMAIL }}
        run: python tracker.py

      - name: Commit updated status
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_status.txt || true
          git diff --staged --quiet || (git commit -m "chore: update status cache [skip ci]" && git push)
